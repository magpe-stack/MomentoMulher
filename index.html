<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momento Mulher</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body class="dark-theme">

    <header class="top-bar">
        <!-- Logo e Nome à Esquerda -->
        <div class="brand">
            <svg class="brand-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="36" height="36" fill="currentColor">
                <path d="M50 5 C25 5 5 25 5 50 C5 75 25 95 50 95 C75 95 95 75 95 50 C95 25 75 5 50 5 Z M50 12 C71 12 88 29 88 50 C88 71 71 88 50 88 C29 88 12 71 12 50 C12 29 29 12 50 12 Z" />
                <path d="M42 30 C38 35 36 42 38 50 C40 58 46 64 54 66 C52 72 48 76 42 78 C38 79 34 78 30 75 C35 83 45 86 54 83 C64 80 70 70 68 58 C66 48 58 40 48 38 C45 38 43 36 42 30 Z" />
                <polygon points="72,25 74,31 80,31 75,35 77,41 72,37 67,41 69,35 64,31 70,31" />
                <polygon points="28,22 29,26 33,26 30,29 31,33 28,30 25,33 26,29 23,26 27,26" />
            </svg>
            <span class="brand-title">Momento Mulher</span>
        </div>

        <!-- Botão 1: Modo Claro / Escuro à Direita -->
        <button id="themeToggle" class="icon-btn" aria-label="Alternar Tema">
            <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        </button>
    </header>

    <main class="content-container">
        <p id="quoteText" class="quote-text">Carregando...</p>
    </main>

    <footer class="bottom-bar">
        <div class="actions-group">
            <!-- Botão 2: Copiar Frase (Ícone de Mão) -->
            <button id="copyBtn" class="icon-btn" aria-label="Copiar Frase">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path>
                    <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v6"></path>
                    <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path>
                    <path d="M18 8a2 2 0 0 1 2 2v4a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.83L7 15"></path>
                </svg>
            </button>

            <!-- Botão 3: Nova Frase (Ícone de Estrela) -->
            <button id="nextBtn" class="icon-btn" aria-label="Nova Frase">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
            </button>
        </div>
    </footer>

    <div id="toast" class="toast">Copiado!</div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
